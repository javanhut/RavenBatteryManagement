[package]
name = "raven-power"
version = "0.1.0"
edition = "2024"
description = "Native battery management for Raven Linux"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_7"] }
glib = "0.21.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Only for ~/.config/raven/desktop.toml, read to match the desktop look.
toml = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1

